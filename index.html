<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>VALORANT チーム分け</title><meta name="description" content="最高ランクと同じチームになった回数を考慮して、交流カスタムのチームを自動作成。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M10 17h15l7 19 7-19h15L32 51z' fill='%23ff4655'/%3E%3C/svg%3E"><style>
:root{font-family:Inter,'Noto Sans JP',system-ui,sans-serif;color:#e9eef8;background:#09111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% -10%,#253044 0,transparent 37%),#09111f}button,input,select{font:inherit}button{cursor:pointer}main{max-width:1250px;margin:auto;padding:30px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #293549;padding-bottom:22px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:13px;font-weight:850;letter-spacing:.04em}.mark{width:37px;height:37px;background:#ff4655;clip-path:polygon(0 0,50% 72%,100% 0,77% 0,50% 40%,23% 0);}.eyebrow{color:#ff6875;font-size:12px;font-weight:800;letter-spacing:.16em}h1{font-size:clamp(25px,3vw,36px);margin:8px 0 6px;letter-spacing:-.03em}p{margin:0;color:#aab8cd;line-height:1.7}.intro{margin-bottom:27px}.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(350px,.75fr);gap:22px;align-items:start}.panel{background:#111d2d;border:1px solid #2a3a4e;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px #0002}.panel-head{padding:20px 22px;border-bottom:1px solid #29394d;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:18px}.count{color:#92a5bb;font-size:13px}.controls{display:flex;gap:14px;flex-wrap:wrap;padding:18px 22px;background:#142235;align-items:end}.field{display:grid;gap:8px;color:#bfcce0;font-size:14px;font-weight:700}.stepper{display:flex;align-items:center;border:1px solid #3a4c61;border-radius:9px;overflow:hidden;height:42px}.stepper button{background:#1b2c42;border:0;color:white;width:40px;height:42px;font-size:21px}.stepper output{min-width:40px;text-align:center;font-weight:800}.hint{padding:13px 22px;color:#9eafc4;font-size:13px;border-bottom:1px solid #29394d}.roster{padding:8px 14px 16px;max-height:590px;overflow:auto}.player{display:grid;grid-template-columns:48px minmax(110px,1fr) minmax(145px,1fr);gap:12px;align-items:center;padding:11px 7px;border-bottom:1px solid #253448}.player:last-child{border:0}.avatar{width:46px;height:46px;border-radius:11px;border:1px dashed #607188;background:#23364a;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#aebdd0;font-size:20px;font-weight:800;position:relative}.avatar img{width:100%;height:100%;object-fit:cover}.avatar input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;font-size:0}.player input[type=text],select{width:100%;background:#0c1727;border:1px solid #35475d;color:#f4f7fb;border-radius:8px;padding:10px 11px;min-height:42px;outline:0}.player input:focus,select:focus{border-color:#ff5967}.player input::placeholder{color:#788aa1}.rank-wrap{display:grid;gap:4px}.rank-wrap span{font-size:12px;color:#91a5bc}.generate{width:100%;border:0;background:#ff4655;color:#fff;padding:17px;font-weight:850;font-size:16px;transition:filter .2s}.generate:hover{filter:brightness(1.13)}.result{padding:20px 22px}.empty{border:1px dashed #40536b;background:#142438;border-radius:12px;text-align:center;padding:40px 20px;color:#aabbd0;line-height:1.7}.empty strong{display:block;color:#f2f5fb;margin-bottom:7px}.round{margin-bottom:22px}.round:last-child{margin:0}.round-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.round-head strong{font-size:16px}.round-head small{color:#9eafc4}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border:1px solid #344960;border-radius:10px;overflow:hidden;background:#0c1828}.team b{display:block;padding:9px 11px;font-size:13px}.team.a b{background:#233c59;color:#7fc4ff}.team.b b{background:#493344;color:#ff9da6}.member{display:flex;align-items:center;gap:7px;padding:7px 9px;border-top:1px solid #25374b;font-size:13px;white-space:nowrap;overflow:hidden}.member img,.initial{width:25px;height:25px;border-radius:6px;object-fit:cover;flex:none;background:#30455d;display:grid;place-items:center;color:white}.member span:last-child{overflow:hidden;text-overflow:ellipsis}.bench{color:#abbace;font-size:13px;margin-top:8px}.note{font-size:12px;color:#8195ad;margin-top:15px;line-height:1.6}@media(max-width:820px){main{padding:18px 14px 50px}.workspace{grid-template-columns:1fr}.roster{max-height:none}}@media(max-width:440px){.player{grid-template-columns:42px minmax(80px,1fr) minmax(125px,1fr);gap:7px;padding:10px 2px}.avatar{width:40px;height:40px}.player input[type=text],select{padding:8px 6px;font-size:13px}.panel-head,.controls,.result,.hint{padding-left:14px;padding-right:14px}.teams{gap:6px}.member{padding:6px 5px;font-size:12px}}
</style></head><body><main><header><div class="brand"><span class="mark" aria-hidden="true"></span><span>VALORANT / TEAM MAKER</span></div><span class="eyebrow">CUSTOM MATCH</span></header><div class="intro"><div class="eyebrow">交流カスタムのチーム分け</div><h1>バランスよく、毎試合ちがう仲間と。</h1><p>参加者を入力して、チーム分けを作成。アイコンはクリック・画像の貼り付けに対応しています。</p></div><div class="workspace"><section class="panel"><div class="panel-head"><h2>参加者</h2><span class="count" id="countLabel"></span></div><div class="controls"><label class="field">人数<div class="stepper"><button id="minus" type="button" aria-label="人数を減らす">−</button><output id="playerCount">10</output><button id="plus" type="button" aria-label="人数を増やす">＋</button></div></label><label class="field" for="roundCount">試合数<select id="roundCount" aria-label="試合数"></select></label></div><div class="hint">最高ランクを選ぶほど、実力差を考慮した組み合わせになります。画像を貼り付ける場合はアイコン欄を選択して Ctrl+V。</div><div class="roster" id="roster"></div><button class="generate" id="generate" type="button">チーム分けを作成 →</button></section><section class="panel"><div class="panel-head"><h2>対戦表</h2><span class="count" id="resultCount">未作成</span></div><div class="result" id="results"><div class="empty"><strong>まだ対戦表はありません</strong>参加者と試合数を設定して、チーム分けを作成してください。</div></div></section></div></main><script>
const ranks=['未設定','アイアン 1','アイアン 2','アイアン 3','ブロンズ 1','ブロンズ 2','ブロンズ 3','シルバー 1','シルバー 2','シルバー 3','ゴールド 1','ゴールド 2','ゴールド 3','プラチナ 1','プラチナ 2','プラチナ 3','ダイヤモンド 1','ダイヤモンド 2','ダイヤモンド 3','アセンダント 1','アセンダント 2','アセンダント 3','イモータル 1','イモータル 2','イモータル 3','レディアント'];
const players=Array.from({length:10},(_,i)=>({id:i,name:'',rank:0,image:''}));let nextId=10,rounds=[];const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(let i=0;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent=`${i}試合`;if(i===3)o.selected=true;$('roundCount').append(o)}
function renderRoster(){const wrap=$('roster');wrap.innerHTML='';players.forEach((p,i)=>{const row=document.createElement('div');row.className='player';const avatar=document.createElement('label');avatar.className='avatar';avatar.title='画像を選択、またはここを選択して画像を貼り付け';avatar.tabIndex=0;avatar.setAttribute('aria-label',`${i+1}人目のアイコン`);avatar.innerHTML=(p.image?`<img alt="" src="${p.image}">`:String(i+1))+`<input type="file" accept="image/*" aria-label="${i+1}人目の画像を選択">`;avatar.querySelector('input').addEventListener('change',e=>{const f=e.target.files[0];if(f)readImage(f,p)});avatar.addEventListener('paste',e=>{const file=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'))?.getAsFile();if(file){e.preventDefault();readImage(file,p)}});const name=document.createElement('input');name.type='text';name.placeholder=`参加者 ${i+1}`;name.setAttribute('aria-label',`${i+1}人目の名前`);name.value=p.name;name.addEventListener('input',()=>p.name=name.value);const rw=document.createElement('label');rw.className='rank-wrap';rw.innerHTML='<span>最高ランク</span>';const sel=document.createElement('select');sel.setAttribute('aria-label',`${i+1}人目の最高ランク`);ranks.forEach((r,j)=>{const o=document.createElement('option');o.value=j;o.textContent=r;sel.append(o)});sel.value=p.rank;sel.addEventListener('change',()=>p.rank=Number(sel.value));rw.append(sel);row.append(avatar,name,rw);wrap.append(row)});$('playerCount').textContent=players.length;$('countLabel').textContent=`${players.length}人`}
function readImage(file,p){if(!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=canvas.height=128;const ctx=canvas.getContext('2d');const side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,128,128);p.image=canvas.toDataURL('image/jpeg',.83);renderRoster()};img.src=reader.result};reader.readAsDataURL(file)}
$('minus').onclick=()=>{if(players.length>2){players.pop();renderRoster()}};$('plus').onclick=()=>{if(players.length<20){players.push({id:nextId++,name:'',rank:0,image:''});renderRoster()}};
function generate(){const count=Number($('roundCount').value);rounds=[];const pairs=new Map(),bench=new Map(),sides=new Map();const key=(a,b)=>[a.id,b.id].sort((x,y)=>x-y).join(':');function score(attackers,defenders){const sum=t=>t.reduce((s,p)=>s+(p.rank||11),0);let repeat=0;for(const team of [attackers,defenders])for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++)repeat+=(pairs.get(key(team[i],team[j]))||0)**2+(pairs.get(key(team[i],team[j]))||0);let sideImbalance=0;for(const p of attackers){const s=sides.get(p.id)||{attack:0,defense:0};sideImbalance+=(s.attack+1-s.defense)**2}for(const p of defenders){const s=sides.get(p.id)||{attack:0,defense:0};sideImbalance+=(s.attack-s.defense-1)**2}return Math.abs(sum(attackers)/attackers.length-sum(defenders)/defenders.length)*1.7+repeat*9+sideImbalance*.35}
for(let r=0;r<count;r++){let resting=null;if(players.length%2){const min=Math.min(...players.map(p=>bench.get(p.id)||0));const eligible=players.filter(p=>(bench.get(p.id)||0)===min);resting=eligible[Math.floor(Math.random()*eligible.length)];bench.set(resting.id,(bench.get(resting.id)||0)+1)}const active=players.filter(p=>p!==resting),half=active.length/2;let best=null,bestScore=Infinity;for(let attempt=0;attempt<Math.max(500,active.length*160);attempt++){const shuffled=[...active].sort(()=>Math.random()-.5);const a=shuffled.slice(0,half),b=shuffled.slice(half);const forward=score(a,b),reverse=score(b,a);const chosen=forward<=reverse?[a,b]:[b,a],s=Math.min(forward,reverse)+Math.random()*.2;if(s<bestScore){bestScore=s;best=chosen}}const [a,b]=best;for(const team of [a,b])for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){const k=key(team[i],team[j]);pairs.set(k,(pairs.get(k)||0)+1)}for(const p of a){const s=sides.get(p.id)||{attack:0,defense:0};s.attack++;sides.set(p.id,s)}for(const p of b){const s=sides.get(p.id)||{attack:0,defense:0};s.defense++;sides.set(p.id,s)}rounds.push({a,b,resting})}let bestMask=0,bestImbalance=Infinity;for(let mask=0;mask<1<<rounds.length;mask++){const differences=new Map(players.map(p=>[p.id,0]));rounds.forEach((round,i)=>{const swapped=Boolean(mask&(1<<i));for(const p of round.a)differences.set(p.id,differences.get(p.id)+(swapped?-1:1));for(const p of round.b)differences.set(p.id,differences.get(p.id)+(swapped?1:-1))});const imbalance=[...differences.values()].reduce((sum,d)=>sum+d*d,0);if(imbalance<bestImbalance){bestImbalance=imbalance;bestMask=mask}}rounds.forEach((round,i)=>{if(bestMask&(1<<i))[round.a,round.b]=[round.b,round.a]});renderResults()}
function member(p){const n=escapeHtml(p.name.trim()||`参加者 ${players.indexOf(p)+1}`);return `<div class="member">${p.image?`<img src="${p.image}" alt="">`:`<span class="initial">${n[0]}</span>`}<span title="${n}">${n}</span></div>`}function renderResults(){const el=$('results');$('resultCount').textContent=`${rounds.length}試合`;if(!rounds.length){el.innerHTML='<div class="empty"><strong>試合数は0です</strong>試合数を選ぶと対戦表を作成できます。</div>';return}el.innerHTML=rounds.map((round,i)=>`<div class="round"><div class="round-head"><strong>GAME ${String(i+1).padStart(2,'0')}</strong><small>${round.a.length} vs ${round.b.length}</small></div><div class="teams"><div class="team a"><b>アタッカー</b>${round.a.map(member).join('')}</div><div class="team b"><b>ディフェンダー</b>${round.b.map(member).join('')}</div></div>${round.resting?`<div class="bench">休憩：${escapeHtml(round.resting.name.trim()||`参加者 ${players.indexOf(round.resting)+1}`)}</div>`:''}</div>`).join('')+'<p class="note">最高ランクの平均差と同じチームになった回数を優先し、各人のアタッカー／ディフェンダー回数もできるだけ均等にします。ランク未設定の参加者はゴールド相当として計算します。</p>'} $('generate').onclick=generate;renderRoster();
</script></body></html>
